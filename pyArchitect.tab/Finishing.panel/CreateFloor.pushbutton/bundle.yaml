tooltip: 
  es_es: >-
    Crea suelos para habitaciones seleccionadas
    _________________________________________________________________
    Sigue los pasos :
    Paso 1 - Seleccione habitación (es)
    Paso 2: Seleccione la opción desplazamiento y elija el tipo de acabado

    La opción "Consider Thickness" tiene en cuenta el grosor del suelo y lo desplaza hacia abajo
  en_us: >-
    Creates floors for selected rooms
    _________________________________________________________________
    Follow the steps :
    Step 1 — Select room(s) 
    Step 2 — Select offset option and choose finishing type 

    Option "Consider Thickness" takes into account floor's Thickness and shifts it down
  ru: >-
    Создание отделки пола для выбранных помещений
    _________________________________________________________________
    Принцип работы инструмента:
    Шаг 1 — Выделить помещение(я)
    Шаг 2 — Выбрать опцию смещения и тип отделки

    Функция "Consider Thickness" смещает отделку пола вниз на её толщину

