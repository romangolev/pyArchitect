title:
  es_es: |-
    Revisar
    vínculos
  en_us: |-
    Review Links
  ru: |-
    Проверка
    связей
tooltip:
  es_es: >-
    Doctor de vínculos: revisa los vínculos de Revit y sus subproyectos.
    Fija los vínculos sin fijar, mueve cada vínculo a su propio subproyecto
    (##_RVT_<ARCHIVO>), renombra o crea el subproyecto cuando el archivo
    vinculado cambió de nombre y elimina los subproyectos de vínculos vacíos
    que dejan los vínculos antiguos. Mayús+clic: elija qué correcciones aplicar.
  en_us: >-
    Link Doctor: checks Revit links and their worksets. Pins unpinned links,
    moves each link to a workset of its own (##_RVT_<FILE>), renames or
    creates that workset when the linked file was renamed, and deletes empty
    link worksets left behind by old links. Shift+click: pick which fixes to apply.
  ru: >-
    Доктор связей: проверяет связи Revit и их рабочие наборы. Закрепляет
    связи, переносит каждую связь на собственный рабочий набор
    (##_RVT_<ФАЙЛ>), переименовывает или создаёт его при смене имени файла
    связи и удаляет пустые рабочие наборы старых связей. Shift+клик: выбрать,
    какие исправления применить.

author: Roman Golev
engine:
  persistent: true