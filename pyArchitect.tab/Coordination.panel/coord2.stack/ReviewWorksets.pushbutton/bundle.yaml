title:
  es_es: Revisar
    Subproyectos
  en_us: Review
    Worksets
  ru: Проверка
    Наборов
tooltip:
  es_es: >-
    Doctor de subproyectos: revisa los subproyectos del proyecto.
    _________________________________________________________________
    Da a cada archivo vinculado su propio subproyecto
    (`##_RVT_<ARCHIVO>`), saca los vínculos de cualquier otro
    subproyecto y borra los subproyectos de vínculos (`##`) vacíos. Los
    subproyectos predeterminados de Revit se dejan como están.
    Mayús+clic: elija qué correcciones aplicar.
  en_us: >-
    Workset doctor: reviews the worksets of the project.
    _________________________________________________________________
    Gives every linked file a workset of its own
    (`##_RVT_<FILE>`), takes the links off every other workset and
    deletes empty link worksets (`##`). Revit's default worksets are
    left as they are. Shift+click: pick which fixes to apply.
  ru: >-
    Доктор рабочих наборов: проверяет рабочие наборы проекта.
    _________________________________________________________________
    Даёт каждому связанному файлу собственный рабочий набор
    (`##_RVT_<ФАЙЛ>`), убирает связи со всех других наборов и
    удаляет пустые наборы связей (`##`). Рабочие наборы Revit по
    умолчанию остаются как есть. Shift+клик: выбрать, какие
    исправления применить.

author: Roman Golev
engine:
  persistent: true
