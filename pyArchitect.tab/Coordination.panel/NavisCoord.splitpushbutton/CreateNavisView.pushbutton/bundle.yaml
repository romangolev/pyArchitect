title:
  es_es: Vista Navis
  en_us: Navis View
  ru: Вид Navis
tooltip:
  es_es: >-
    Crea o actualiza la vista 3D de Navisworks.
    _________________________________________________________________
    Crea o actualiza la vista 3D de Navisworks según el perfil de
    pyArchitect seleccionado. Mayús+clic define el perfil por defecto
    y edita los preajustes.
  en_us: >-
    Creates or updates the Navisworks 3D view.
    _________________________________________________________________
    Creates or updates the Navisworks 3D view from the selected
    pyArchitect profile. Shift+Click sets the default profile and edits
    presets.
  ru: >-
    Создаёт или обновляет 3D вид Navisworks.
    _________________________________________________________________
    Создаёт или обновляет 3D вид Navisworks по выбранному профилю
    pyArchitect. Shift+клик задаёт профиль по умолчанию и редактирует
    пресеты.

author: Roman Golev
