title:
  es_es: |-
    Delete
    Shared Parameter
  en_us: |-
    Delete
    Shared Parameter
  ru: |-
    Delete
    Shared Parameter
tooltip: 
  es_es: >-
    Elimina completamente los parametros compartidos seleccionados del proyecto.
    Permite seleccionar varios parametros a la vez y borrarlos por lotes tras confirmacion.
    Permite agregar otro parametro compartido con el mismo GUID pero diferentes propiedades
  en_us: >-
    Completely removes the selected shared parameters from the project.
    Allows selecting multiple parameters and deleting them in a batch after confirmation.
    Allows to add another shared parameter with the same GUID but different properties
  ru: >-
    Удаляет выбранные общие параметры полностью из проекта.
    Позволяет выбрать несколько параметров и удалить их пакетно после подтверждения.
    После удаления можно добавить в проект параметр с тем же GUID но другими свойствами
author: Roman Golev
engine:
  persistent: true